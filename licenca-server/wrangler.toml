name = "gestor-licenca"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [
  { pattern = "painel.smsjrdeveloper.com.br", custom_domain = true }
]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "gestor-licenca"
database_id = "b037da95-e1a4-412b-a7e0-3e82647aa072"
migrations_dir = "migrations"

[[services]]
binding = "RELAY"
service = "gestor-relay"

# Instalador e APK da edição online. Plano gratuito do R2 (10 GB, sem taxa de saída).
# Criar uma vez: npx wrangler r2 bucket create gestor-atualizacao
[[r2_buckets]]
binding = "ATUALIZACAO"
bucket_name = "gestor-atualizacao"

# Fotos e artes da Central de Ofertas. O endereço público (r2.dev ou domínio) entra em FOTOS_PUBLIC_BASE.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "gestor-ofertas"

[vars]
FOTOS_PUBLIC_BASE = "https://pub-b4ce55fc842145b9a0772045f8271a9c.r2.dev"

# Segredos (wrangler secret put ...):
#   LICENCA_PRIVATE_KEY  chave Ed25519 PKCS8 em PEM (par da pública embutida em server/licenca.js)
#   ADMIN_PASSWORD       senha do painel /admin
