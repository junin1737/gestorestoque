name = "gestor-licenca"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "gestor-licenca"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Segredos (wrangler secret put ...):
#   LICENCA_PRIVATE_KEY  chave Ed25519 PKCS8 em PEM (par da pública embutida em server/licenca.js)
#   ADMIN_PASSWORD       senha do painel /admin
