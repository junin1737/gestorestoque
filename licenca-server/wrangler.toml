name = "gestor-licenca"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [
  { pattern = "painel.smsjrdeveloper.com.br", custom_domain = true }
]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "gestor-licenca"
database_id = "b037da95-e1a4-412b-a7e0-3e82647aa072"
migrations_dir = "migrations"

# Segredos (wrangler secret put ...):
#   LICENCA_PRIVATE_KEY  chave Ed25519 PKCS8 em PEM (par da pública embutida em server/licenca.js)
#   ADMIN_PASSWORD       senha do painel /admin
