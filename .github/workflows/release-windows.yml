name: Release Windows

on:
  workflow_dispatch:
  push:
    branches: [online]
    paths:
      - 'package.json'
      - '.github/workflows/release-windows.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "android-sdk"
          $zip = Join-Path $env:RUNNER_TEMP "cmdtools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $sdk "tmp")
          New-Item -ItemType Directory -Force -Path (Join-Path $sdk "cmdline-tools\latest") | Out-Null
          Move-Item (Join-Path $sdk "tmp\cmdline-tools\*") (Join-Path $sdk "cmdline-tools\latest")
          $mgr = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          1..40 | ForEach-Object { "y" } | & $mgr --sdk_root=$sdk --licenses
          & $mgr --sdk_root=$sdk "platforms;android-34" "build-tools;34.0.0"
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Decode keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:KEYSTORE_B64)
          [IO.File]::WriteAllBytes("$pwd\android-app\gestor-online.jks", $bytes)

      - name: Build APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .\gradlew.bat assembleRelease --no-daemon

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp android-app/app/build/outputs/apk/release/app-release.apk "dist/gestorestoque-online-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            Gestor Estoque Online ${{ steps.ver.outputs.version }}.

            No computador: **Sobre → Verificar atualização agora**.
            No celular, o APK desta mesma versão se oferece para atualizar ao abrir.
          files: |
            dist/gestorestoque-online-*.exe
            dist/gestorestoque-online-*.apk
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar atualização na nuvem
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Sem token da Cloudflare. O instalador continua no GitHub até o segredo ser cadastrado."
            exit 0
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          EXE="gestorestoque-online-${VERSION}.exe"
          APK="gestorestoque-online-${VERSION}.apk"
          VERSION="$VERSION" EXE="$EXE" APK="$APK" node -e "const fs=require('fs'); fs.writeFileSync('dist/manifest.json', JSON.stringify({versao:process.env.VERSION, notas:'Gestor Estoque Online '+process.env.VERSION+'.', exe:process.env.EXE, apk:process.env.APK}))"
          npx --yes wrangler@4.147.0 r2 object put "gestor-atualizacao/online/${EXE}" --file="dist/${EXE}" --content-type=application/octet-stream --remote
          npx --yes wrangler@4.147.0 r2 object put "gestor-atualizacao/online/${APK}" --file="dist/${APK}" --content-type=application/vnd.android.package-archive --remote
          npx --yes wrangler@4.147.0 r2 object put "gestor-atualizacao/online/manifest.json" --file="dist/manifest.json" --content-type=application/json --remote
