name: Release Windows

on:
  workflow_dispatch:
  push:
    branches: [online]
    paths:
      - 'package.json'
      - '.github/workflows/release-windows.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: android-app
        run: .\gradlew.bat assembleRelease --no-daemon

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp android-app/app/build/outputs/apk/release/app-release.apk "dist/gestorestoque-online-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            Gestor Estoque Online ${{ steps.ver.outputs.version }}.

            No computador: **Sobre → Verificar atualização agora**.
            No celular, o APK desta mesma versão se oferece para atualizar ao abrir.
          files: |
            dist/gestorestoque-online-*.exe
            dist/gestorestoque-online-*.apk
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
