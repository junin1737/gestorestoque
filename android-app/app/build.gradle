plugins {
    id 'com.android.application'
}

// A versão do APK é a do Git (package.json da raiz), a mesma do instalador Windows.
def pkgGit = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
def versaoGit = (pkgGit.version ?: "0.0.0").toString()
def numerosVersao = (versaoGit =~ /\d+/).collect { it.toInteger() }
while (numerosVersao.size() < 4) numerosVersao << 0
def codigoVersao = numerosVersao[0] * 1000000 + numerosVersao[1] * 10000 + numerosVersao[2] * 10 + numerosVersao[3]

def chaveProps = new Properties()
def chaveArquivo = rootProject.file("keystore.properties")
if (chaveArquivo.exists()) chaveProps.load(new FileInputStream(chaveArquivo))
def chaveSenha = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: chaveProps.getProperty("storePassword")
def chaveKey = System.getenv("ANDROID_KEY_PASSWORD") ?: chaveProps.getProperty("keyPassword") ?: chaveSenha
def chaveCaminho = System.getenv("ANDROID_KEYSTORE_FILE") ?: chaveProps.getProperty("storeFile") ?: "gestor-online.jks"

android {
    namespace 'com.mtautomacoes.gestorestoque'
    compileSdk 34

    defaultConfig {
        // Edição online: instala ao lado do app normal (outro applicationId).
        applicationId "com.mtautomacoes.gestorestoque.online"
        minSdk 24
        targetSdk 34
        versionCode codigoVersao
        versionName versaoGit
        // Celulares reais são ARM; x86 só serve para emulador e dobra o tamanho (OCR do ML Kit).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(chaveCaminho)
            storePassword chaveSenha
            keyAlias "gestor"
            keyPassword chaveKey
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Chave NF-e: CameraX + ML Kit contínuo (rápido; sem auto-zoom lento do Code Scanner)
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Chave NF-e: lê os 44 dígitos impressos quando a barra não decodifica
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
