plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtautomacoes.gestorestoque'
    compileSdk 34

    defaultConfig {
        applicationId "com.mtautomacoes.gestorestoque"
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName "1.0.26"
        // Celulares reais são ARM; x86 só serve para emulador e dobra o tamanho (OCR do ML Kit).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Assinatura debug: permite instalar o APK de piloto sem keystore próprio
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Chave NF-e: CameraX + ML Kit contínuo (rápido; sem auto-zoom lento do Code Scanner)
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Chave NF-e: lê os 44 dígitos impressos quando a barra não decodifica
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
