plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtautomacoes.gestorestoque'
    compileSdk 34

    defaultConfig {
        applicationId "com.mtautomacoes.gestorestoque"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.0.17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Assinatura debug: permite instalar o APK de piloto sem keystore próprio
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Leitura da chave NF-e (CODE_128 longo): auto-zoom do Google Code Scanner
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
